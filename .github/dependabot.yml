version: 2
updates:
  # Engine (android-automation-app) pinned as the engine/ submodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Kotlin plugin used to build agp; keep it at or above the engine's Kotlin version
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
